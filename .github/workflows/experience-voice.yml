name: Generate illustrated world Sulafat additions
on:
  push:
    branches: [feat/illustrated-worlds-20260923]
    paths: [audio/experience-phrases.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: illustrated-worlds-voice
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-genai lameenc
      - name: Generate only new Sulafat clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_experience_voice.py
      - name: Save voice additions on development branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/voice/ko audio/experience-files.js audio/experience-voice-report.json 2>/dev/null || git add audio/voice/ko
          if ! git diff --cached --quiet; then
            git commit -m 'Add Sulafat recordings for illustrated worlds'
            git push origin HEAD:feat/illustrated-worlds-20260923
          fi
