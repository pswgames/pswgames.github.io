name: Build PWA icons
on:
  push:
    branches: [pwa-v515-temp]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild valid 512 and maskable icons from 192 source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          identify icons/icon-192.png
          convert icons/icon-192.png -filter Lanczos -resize 512x512 icons/icon-512.png
          convert -size 512x512 xc:'#72C7F2' \( icons/icon-192.png -filter Lanczos -resize 360x360 \) -gravity center -composite icons/icon-maskable-512.png
          identify icons/icon-512.png
          identify icons/icon-maskable-512.png
          rm -f .github/workflows/build-maskable.yml
      - name: Commit valid PWA icons
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild valid PWA icons'
          git push
