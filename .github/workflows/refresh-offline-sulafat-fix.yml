name: Refresh offline manifest for Sulafat routing fix

on:
  push:
    branches:
      - fix/sulafat-audio-routing-20260922
    paths:
      - .github/workflows/refresh-offline-sulafat-fix.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sulafat-audio-routing-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:offline
      - name: Commit refreshed offline manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh offline manifest for Sulafat routing"
            git push origin HEAD:fix/sulafat-audio-routing-20260922
          fi
