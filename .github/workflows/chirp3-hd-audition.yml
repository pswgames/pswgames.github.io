name: Generate Chirp 3 HD audition
on:
  push:
    branches:
      - feat/chirp3-hd-audition-20260921
    paths:
      - .github/workflows/chirp3-hd-audition.yml
      - scripts/generate_chirp3_audition.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Google Cloud credentials
        env:
          GCP_TTS_CREDENTIALS: ${{ secrets.GCP_TTS_CREDENTIALS }}
        run: |
          if [ -z "$GCP_TTS_CREDENTIALS" ]; then
            echo "::error::Repository secret GCP_TTS_CREDENTIALS is not configured."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TTS_CREDENTIALS }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Cloud TTS client
        run: python -m pip install --disable-pip-version-check google-cloud-texttospeech

      - name: Generate three Korean Chirp 3 HD samples
        run: python scripts/generate_chirp3_audition.py

      - name: Commit audition files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/chirp3-audition audio/chirp3-audition-report.json
          if git diff --cached --quiet; then
            echo "No audition changes"
          else
            git commit -m "Generate Chirp 3 HD Korean audition samples"
            git push origin HEAD:feat/chirp3-hd-audition-20260921
          fi
