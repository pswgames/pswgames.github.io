name: Sync 7.1.1 offline cache
on:
  push:
    branches:
      - fix/pwa-update-711-20260923
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-update-711-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:offline
      - name: Commit generated cache
        run: |
          if git diff --quiet -- sw.js; then
            echo "sw.js already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "chore: sync 7.1.1 offline cache [skip ci]"
          git push
