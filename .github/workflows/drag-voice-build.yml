name: Build drag interaction recordings
on:
  push:
    branches: [feat/drag-voice-20261016]
    paths: [scripts/build-play-dialogue.cjs, .github/workflows/drag-voice-build.yml]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install google-genai lameenc
      - run: node scripts/build-play-dialogue.cjs
      - run: python scripts/extend_play_voice.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save generated recordings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/voice audio/play-files.js audio/play-voice-report.json audio/play-catalog.js audio/play-dialogue.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: record fixed Sulafat drag and block game dialogue"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drag-voice-results
          path: .test-results/voice-generation
