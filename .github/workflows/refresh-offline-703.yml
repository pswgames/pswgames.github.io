name: Refresh offline manifest for 7.0.3

on:
  push:
    branches:
      - fix/elevator-voice-sequence-703-20260922
    paths:
      - .github/workflows/refresh-offline-703.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/elevator-voice-sequence-703-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:offline
      - name: Commit refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh offline manifest for 7.0.3"
            git push origin HEAD:fix/elevator-voice-sequence-703-20260922
          fi
