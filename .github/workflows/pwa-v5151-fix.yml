name: Build Seowoo PWA 5.15.1 assets
on:
  push:
    branches: [pwa-v5151-fix-temp]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify fresh PWA icons
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          cp icons/icon-192.png icons/icon-192-v515.png
          convert icons/icon-192.png -resize 512x512 -background '#72C7F2' -alpha remove -alpha off icons/icon-512-v515.png
          convert -size 512x512 xc:'#72C7F2' \( icons/icon-192.png -resize 320x320 \) -gravity center -composite -alpha remove -alpha off icons/icon-maskable-512-v515.png
          identify icons/icon-192-v515.png
          identify icons/icon-512-v515.png
          identify icons/icon-maskable-512-v515.png
          test "$(identify -format '%wx%h' icons/icon-192-v515.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512-v515.png)" = '512x512'
          test "$(identify -format '%wx%h' icons/icon-maskable-512-v515.png)" = '512x512'
          node --check js/pwa-v515.js
          node --check js/v5-panorama.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          rm -f .github/workflows/pwa-v5151-fix.yml
      - name: Commit verified PWA assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build verified PWA icons for v5.15.1'
          git push
