name: Web App QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check offline manifest is current
        run: |
          pnpm build:offline
          git diff --exit-code -- sw.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-qa-results
          path: .test-results/functional-results.json
          if-no-files-found: ignore
          retention-days: 7
