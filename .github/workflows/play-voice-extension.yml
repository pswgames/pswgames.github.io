name: Generate new play dialogue with existing Sulafat voice
on:
  push:
    branches: [feat/playground-art-voice-20261016]
    paths: [audio/play-dialogue.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: play-voice-extension
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-genai lameenc
      - name: Append new recordings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'Existing Gemini key is unavailable'; exit 1; }
          python scripts/extend_play_voice.py
      - name: Checkpoint new recordings
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/voice/ko audio/play-files.js audio/play-voice-report.json 2>/dev/null || git add audio/voice/ko
          if ! git diff --cached --quiet; then
            git commit -m 'feat: append recorded Sulafat play dialogue'
            git push origin HEAD:feat/playground-art-voice-20261016
          fi
