name: Build Android Kiosk APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/android-kiosk-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-kiosk --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seowoo-playground-kiosk-debug-apk
          path: android-kiosk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
