name: Build Android Kiosk APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/android-kiosk-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-kiosk --no-daemon assembleDebug

      - name: Prepare Y700 no-reset package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-kiosk/dist
          cp android-kiosk/app/build/outputs/apk/debug/app-debug.apk android-kiosk/dist/seowoo-playground-y700-kiosk-v1.2.0-test.apk
          cp android-kiosk/tools/Y700_CHECK_NO_RESET_SUPPORT.bat android-kiosk/dist/
          cp android-kiosk/tools/Y700_SETUP_COMPLETE_LOCK.bat android-kiosk/dist/
          cp android-kiosk/tools/Y700_REMOVE_DEVICE_OWNER.bat android-kiosk/dist/Y700_REMOVE_SEOWOO_USER.bat
          cp android-kiosk/README.md android-kiosk/dist/README_Y700_NO_RESET.md

      - name: Upload Y700 no-reset package
        uses: actions/upload-artifact@v4
        with:
          name: seowoo-y700-no-reset-profile-owner-v1.2.0
          path: android-kiosk/dist/*
          if-no-files-found: error
