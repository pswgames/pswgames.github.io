name: Build Android Kiosk APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/android-kiosk-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Windows setup scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('android-kiosk/tools/Y700_CHECK_NO_RESET_SUPPORT.bat'),
              Path('android-kiosk/tools/Y700_SETUP_COMPLETE_LOCK.bat'),
              Path('android-kiosk/tools/Y700_REMOVE_DEVICE_OWNER.bat'),
          ]

          for path in files:
              data = path.read_bytes()
              if data.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'{path}: UTF-8 BOM is not allowed')
              try:
                  data.decode('ascii')
              except UnicodeDecodeError as exc:
                  raise SystemExit(f'{path}: non-ASCII byte at offset {exc.start}') from exc
              print(f'OK: {path}')

          gradle = Path('android-kiosk/app/build.gradle').read_text()
          setup = Path('android-kiosk/tools/Y700_SETUP_COMPLETE_LOCK.bat').read_text()
          pkg = 'io.github.pswgames.seowoo.kiosk'
          if f"applicationId '{pkg}'" not in gradle:
              raise SystemExit('isolated kiosk applicationId is missing')
          if f'set "PKG={pkg}"' not in setup:
              raise SystemExit('setup BAT package ID does not match applicationId')
          print('OK: isolated kiosk package IDs match')
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle -p android-kiosk --no-daemon :app:assembleDebug :checker:assembleDebug

      - name: Prepare Y700 no-reset package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-kiosk/dist
          cp android-kiosk/app/build/outputs/apk/debug/app-debug.apk android-kiosk/dist/seowoo-playground-y700-kiosk-v1.2.2-test.apk
          cp android-kiosk/checker/build/outputs/apk/debug/checker-debug.apk android-kiosk/dist/Y700_NO_RESET_CHECKER_v1.0.0.apk
          cp android-kiosk/tools/Y700_CHECK_NO_RESET_SUPPORT.bat android-kiosk/dist/
          cp android-kiosk/tools/Y700_SETUP_COMPLETE_LOCK.bat android-kiosk/dist/
          cp android-kiosk/tools/Y700_REMOVE_DEVICE_OWNER.bat android-kiosk/dist/Y700_REMOVE_SEOWOO_USER.bat
          cp android-kiosk/README.md android-kiosk/dist/README_Y700_NO_RESET.md

      - name: Upload standalone checker APK
        uses: actions/upload-artifact@v4
        with:
          name: Y700_NO_RESET_CHECKER_v1.0.0
          path: android-kiosk/checker/build/outputs/apk/debug/checker-debug.apk
          if-no-files-found: error

      - name: Upload Y700 no-reset package
        uses: actions/upload-artifact@v4
        with:
          name: seowoo-y700-no-reset-profile-owner-v1.2.2
          path: android-kiosk/dist/*
          if-no-files-found: error
