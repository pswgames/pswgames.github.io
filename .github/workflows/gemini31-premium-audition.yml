name: Generate Gemini 3.1 premium voice audition
on:
  push:
    branches:
      - feat/gemini31-premium-audition-20260921
    paths:
      - .github/workflows/gemini31-premium-audition.yml
      - scripts/generate_gemini31_audition.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is not configured."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check --upgrade google-genai

      - name: Generate three Gemini 3.1 Korean TTS samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_gemini31_audition.py

      - name: Commit audition files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/gemini31-audition audio/gemini31-audition-report.json
          if git diff --cached --quiet; then
            echo "No audition changes"
          else
            git commit -m "Generate Gemini 3.1 premium Korean voice samples"
            git push origin HEAD:feat/gemini31-premium-audition-20260921
          fi
