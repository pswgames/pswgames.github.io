name: Generate Seowoo Neural Audio
# Regenerate after audio regression harness updates.
on:
  push:
    branches:
      - feat/neural-audio-20260921
    paths:
      - .github/workflows/generate-neural-audio.yml
      - scripts/generate_neural_audio.py

permissions:
  contents: write

concurrency:
  group: seowoo-neural-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural TTS generator
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate fixed voice pack and sound effects
        run: python scripts/generate_neural_audio.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Refresh offline cache manifest
        run: pnpm build:offline
      - name: Run full QA
        run: pnpm test
      - name: Summarize generated media
        run: |
          echo "Voice files: $(find audio/voice -type f -name '*.mp3' | wc -l)"
          echo "SFX files: $(find audio/sfx -type f -name '*.wav' | wc -l)"
          du -sh audio/voice audio/sfx
          cat audio/voice-report.json
      - name: Commit generated local audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/files.js audio/sfx.js audio/voice audio/sfx audio/voice-report.json sw.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate fixed neural voice pack [voice-assets]"
            git push origin HEAD:feat/neural-audio-20260921
          fi
