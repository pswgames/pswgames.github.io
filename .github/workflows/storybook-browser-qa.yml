name: Storybook browser QA
on:
  push:
    branches: [main, feat/drag-blockpang-20261016]
    paths: [js/**, css/**, data/**, audio/**, tests/**, index.html, sw.js, package.json, .github/workflows/storybook-browser-qa.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - run: npm test
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: desktop-chromium
            engine: chromium
          - profile: android-chromium
            engine: chromium
          - profile: iphone-webkit
            engine: webkit
          - profile: tablet-webkit
            engine: webkit
          - profile: tablet-landscape-webkit
            engine: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node tests/storybook-browser.cjs
        env:
          QA_PROFILE: ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-browser-qa-${{ matrix.profile }}
          path: .test-results/storybook
          retention-days: 7
