name: Storybook browser QA
on:
  push:
    branches: [main, feat/playground-art-qa-20261016]
    paths: [js/**, css/**, data/**, audio/**, tests/**, index.html, sw.js, package.json, .github/workflows/storybook-browser-qa.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: node tests/storybook-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-browser-qa
          path: .test-results/storybook
          retention-days: 7
