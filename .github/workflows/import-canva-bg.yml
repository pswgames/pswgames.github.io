name: Import generated elevator background
on:
  push:
    branches: [canva-bg-import-temp]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture Canva design with Chrome
        shell: bash
        run: |
          set -euo pipefail
          which google-chrome || which chromium || true
          google-chrome --version || chromium --version || true
          BROWSER=$(command -v google-chrome || command -v chromium)
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1024,1536 --force-device-scale-factor=1 --virtual-time-budget=15000 --screenshot=assets/canva-capture.png 'https://www.canva.com/d/CLeUK_mwmvjJeiF'
          file assets/canva-capture.png
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('assets/canva-capture.png')
          print('capture',im.size)
          PY
      - name: Commit capture for inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/canva-capture.png
          git commit -m 'Capture generated background preview for import'
          git push
