name: Generate Complete Seowoo Voice Pack
# Rebuild after full offline voice-pack policy update.
on:
  push:
    branches:
      - fix/full-voice-coverage-20260921
    paths:
      - .github/workflows/generate-complete-voice-pack.yml
      - scripts/generate_neural_audio.py
      - audio/extra-catalog.js
      - tests/voice-coverage.cjs
      - tests/voice-assets.cjs
      - scripts/build-cache.cjs
      - index.html
permissions:
  contents: write
concurrency:
  group: seowoo-complete-voice-pack
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate missing fixed voice clips
        run: python scripts/generate_neural_audio.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.19.0'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:offline
      - run: pnpm test
      - name: Commit generated voice coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/files.js audio/sfx.js audio/voice audio/sfx audio/voice-report.json sw.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate complete fixed voice coverage [voice-assets]"
            git push origin HEAD:fix/full-voice-coverage-20260921
          fi
