name: Finalize Seowoo v5.15.0
on:
  push:
    branches:
      - v515-build-20260909
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source of truth
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='8b79983346d1f749e34e337e8d73ddda08992e05'
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN" || { echo "main moved: $ACTUAL_MAIN" >&2; exit 1; }
      - name: Reconstruct external WebP from Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          : > /tmp/pano.b64
          for sha in \
            9e2e036af2b1702bad9e53ecac3d6516ae103477 \
            23bf67bca8c599655284389c720229dc884a2ca6 \
            6f9baeb93e8a8a940d607a09b2029e4bb829e4be \
            d93aa01024a0a306cb87130463d30e4afdf36bbc \
            c6d504acf508579dde382221799bc8711ad92b23 \
            0d8cc9a77d70b8d4f266647517976d9c68efea47 \
            790110537738fab37a319e478e48c75eb4ed9060 \
            21f83011561d2ea4765ce7edc25a3638f3c3131a \
            64332bb5f0282f01386f537723198b08d763841e \
            accd718464274d143f3d22b880c72081e62b21fd \
            e719eb4cd6fdac60fd87f37b0b57293cbef95411 \
            b692d6368d621990cecbaa09248a48ab6515908a \
            182972ffd65df4c56b43a2fafd3f6685ae365c0c
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.write(base64.b64decode(d["content"]).decode("ascii"))' \
            >> /tmp/pano.b64
          done
          base64 --decode /tmp/pano.b64 > assets/elevator-city-panorama-v515.webp
          echo 'f8f75d3dbb0facf472bb42a2d65fc457212ba512fac134cf423109ea28a14f8c  assets/elevator-city-panorama-v515.webp' | sha256sum -c -
          test "$(stat -c%s assets/elevator-city-panorama-v515.webp)" = '144301'
          file assets/elevator-city-panorama-v515.webp | grep -q 'Web/P image'
      - name: Write v5.15.0 app patch
        shell: bash
        run: |
          set -euo pipefail
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
            <meta name="theme-color" content="#72C7F2">
            <meta name="description" content="숫자·말글·생각·생활습관·음악을 즐기는 서우의 놀이 공간">
            <meta name="application-name" content="서우 놀이터">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="default">
            <meta name="apple-mobile-web-app-title" content="서우 놀이터">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <meta name="app-version" content="5.15.0">
            <link rel="manifest" href="/manifest.webmanifest?v=5.15.0">
            <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=5.15.0">
            <link rel="apple-touch-icon" href="/icons/icon-192.png?v=5.15.0">
            <link rel="stylesheet" href="/css/app.css?v=5.15.0">
            <link rel="stylesheet" href="/css/v4.css?v=5.15.0">
            <link rel="stylesheet" href="/css/v5.css?v=5.15.0">
            <link rel="stylesheet" href="/css/v5-view.css?v=5.15.0">
            <link rel="stylesheet" href="/css/v515-final.css?v=5.15.0">
            <link rel="stylesheet" href="/css/pwa-v514.css?v=5.15.0">
            <title>서우 놀이터</title>
            <script>
            (()=>{
              'use strict';
              window.__SEOWOO_VERSION__='5.15.0';
              if('serviceWorker' in navigator){
                navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).then(reg=>{
                  try{reg.waiting?.postMessage('SKIP_WAITING')}catch(e){}
                  reg.update().catch(()=>{});
                }).catch(()=>{});
              }
            })();
            </script>
          </head>
          <body>
          <div id="app" class="app">
            <header class="appbar"><button class="brand" data-go="home" aria-label="서우 놀이터 홈"><span class="brand-mark">🌟</span><span><b>서우 놀이터</b><small>오늘도 신나게!</small></span></button><div class="app-actions"><button id="installBtn" class="round-btn" aria-label="앱으로 설치">⬇️</button><button id="soundBtn" class="round-btn" aria-label="음성 켜기 끄기">🔊</button><button id="parentBtn" class="round-btn" aria-label="보호자 메뉴">👨‍👩‍👦</span></button></div></header>
            <main id="main" class="main" aria-live="polite"></main>
            <nav id="bottomNav" class="bottom-nav" aria-label="주요 메뉴"><button data-go="home"><span>🏠</span><small>놀이터</small></button><button data-go="treasure"><span>🏆</span><small>보물상자</small></button><button data-go="music"><span>🎵</span><small>음악</small></button><button data-go="parent"><span>👨‍👩‍👦</span><small>보호자</small></button></nav>
          </div>
          <dialog id="installDialog" class="modal"><div class="modal-card"><div class="modal-icon">🌟</div><h2>서우 놀이터를 앱으로 설치할까?</h2><p>설치하면 주소창 없이 독립된 앱 창으로 열려요.</p><div id="installSteps" class="install-steps"></div><div class="modal-actions"><button id="installAction" class="btn primary">앱으로 설치</button><button id="installLater" class="btn soft">지금은 놀기</button></div></div></dialog>
          <dialog id="breakDialog" class="modal"><div class="modal-card"><div class="modal-icon">🌳</div><h2>눈도 몸도 쉬어볼까?</h2><p>잠깐 화면을 내려놓고 물도 마시고, 엄마아빠랑 몸을 움직여봐요.</p><div class="modal-actions"><button id="breakDone" class="btn primary">쉬고 올게!</button></div></div></dialog>
          <div id="toast" class="toast" role="status"></div>
          <script src="/data/content.js?v=5.15.0"></script>
          <script src="/js/core.js?v=5.15.0"></script>
          <script src="/js/games.js?v=5.15.0"></script>
          <script src="/js/v5-panorama.js?v=5.15.0"></script>
          <script src="/js/v5.js?v=5.15.0"></script>
          <script src="/js/app-v4.js?v=5.15.0"></script>
          <script src="/js/pwa-v514.js?v=5.15.0"></script>
          </body>
          </html>
          EOF
          sed -i 's/^          //' index.html

          cat > manifest.webmanifest <<'EOF'
          {
            "id": "/",
            "name": "서우 놀이터",
            "short_name": "서우 놀이터",
            "description": "숫자·말글·생각·생활습관·음악을 즐기는 서우의 놀이 공간",
            "lang": "ko-KR",
            "start_url": "/?source=pwa&sv=5.15.0",
            "scope": "/",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "orientation": "any",
            "background_color": "#F7FBFF",
            "theme_color": "#72C7F2",
            "categories": ["education", "games"],
            "prefer_related_applications": false,
            "icons": [
              {"src":"/icons/icon-192.png?v=5.15.0","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/icons/icon-512.png?v=5.15.0","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"/icons/icon-512.png?v=5.15.0","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ]
          }
          EOF
          sed -i 's/^          //' manifest.webmanifest

          cat > js/v5-panorama.js <<'EOF'
          /* v5.15.0 — external high-quality WebP panorama; no Base64 image payloads. */
          (()=>{
            'use strict';
            const SRC='/assets/elevator-city-panorama-v515.webp?v=5.15.0';
            window.SeowooPanorama={
              mount(view){
                const img=document.createElement('img');
                img.className='elevator-panorama-image'; img.alt=''; img.decoding='async'; img.loading='eager'; img.fetchPriority='high'; img.draggable=false; img.src=SRC;
                let floor=1,alive=true,shift=0,raf=0,observer=null,loaded=false;
                view.replaceChildren(img); view.style.backgroundImage=`url('${SRC}')`;
                function paint(){ if(!alive)return; const progress=Math.max(0,Math.min(1,(floor-1)/19)); const y=-shift*(1-progress); img.style.transform=`translate3d(-50%,${y.toFixed(2)}px,0) scale(1.018)`; view.style.setProperty('--panorama-progress',progress.toFixed(4)); }
                function resize(){ if(!alive||!view.isConnected)return; const vw=view.clientWidth,vh=view.clientHeight; if(!vw||!vh)return; const iw=img.naturalWidth||941,ih=img.naturalHeight||1672; const minTravel=Math.max(vh*.42,250); const cover=Math.max(vw/iw,(vh+minTravel)/ih); const scale=cover*(window.innerWidth>window.innerHeight?1.09:1.045); const w=iw*scale,h=ih*scale; img.style.width=`${w}px`; img.style.height=`${h}px`; shift=Math.max(0,h-vh); paint(); }
                function requestResize(){ if(raf)return; raf=requestAnimationFrame(()=>{raf=0;resize()}); }
                img.addEventListener('load',()=>{loaded=true;view.classList.add('panorama-ready');resize();},{once:true});
                img.addEventListener('error',()=>{view.classList.add('panorama-fallback');view.style.backgroundImage='none';},{once:true});
                if('ResizeObserver' in window){observer=new ResizeObserver(requestResize);observer.observe(view);} window.addEventListener('resize',requestResize,{passive:true}); window.visualViewport?.addEventListener('resize',requestResize,{passive:true});
                if(img.complete&&img.naturalWidth){loaded=true;view.classList.add('panorama-ready');resize();}else requestResize();
                return{setFloor(v){floor=v;paint();},resize,destroy(){alive=false;observer?.disconnect();if(raf)cancelAnimationFrame(raf);window.removeEventListener('resize',requestResize);window.visualViewport?.removeEventListener('resize',requestResize);img.remove();if(loaded)view.classList.remove('panorama-ready');view.classList.remove('panorama-fallback');view.style.backgroundImage='';}};
              }
            };
          })();
          EOF
          sed -i 's/^          //' js/v5-panorama.js

          cat > css/v515-final.css <<'EOF'
          /* v5.15.0 — final elevator visual polish; keeps v5.14 layout/motion intact. */
          body.elevator-fullscreen .elevator-shell{padding:7px;gap:7px}
          body.elevator-fullscreen .glass-cabin{border-radius:20px}
          body.elevator-fullscreen .cabin-frame{border-width:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.46),inset 0 0 24px rgba(205,238,255,.06)}
          body.elevator-fullscreen .rail{width:6px} body.elevator-fullscreen .rail.left{left:3px} body.elevator-fullscreen .rail.right{right:3px}
          body.elevator-fullscreen .cabin-frame:before{height:6px}
          body.elevator-fullscreen .cabin-frame:after{top:5px;bottom:5px;width:2px;box-shadow:0 0 10px rgba(255,255,255,.55),0 0 7px rgba(0,0,0,.46)}
          body.elevator-fullscreen .door{top:5px;bottom:5px;background:linear-gradient(108deg,rgba(213,239,251,.25) 0,rgba(255,255,255,.09) 24%,rgba(16,48,65,.13) 49%,rgba(241,250,255,.21) 76%,rgba(255,255,255,.06) 100%);border-color:rgba(240,251,255,.48);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 0 32px rgba(191,229,247,.07);backdrop-filter:blur(.45px) saturate(1.04)}
          body.elevator-fullscreen .door:before{opacity:.98;background:linear-gradient(112deg,transparent 27%,rgba(255,255,255,.04) 35%,rgba(255,255,255,.30) 44%,rgba(255,255,255,.07) 52%,transparent 65%)}
          body.elevator-fullscreen .door-l{left:4px} body.elevator-fullscreen .door-r{right:4px}
          body.elevator-fullscreen .door-l:after,body.elevator-fullscreen .door-r:after{width:5px;box-shadow:0 0 12px rgba(0,0,0,.34),0 0 5px rgba(255,255,255,.26)}
          body.elevator-fullscreen .cabin-frame.doors-closed .door{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 0 36px rgba(180,224,245,.10),0 0 18px rgba(6,22,32,.08)}
          body.elevator-fullscreen .cabin-label,body.elevator-fullscreen .elevator-msg{display:none!important}
          @media (orientation:portrait) and (min-width:700px){body.elevator-fullscreen .elevator-shell{grid-template-rows:minmax(0,1fr) auto}body.elevator-fullscreen .floor-panel{padding-top:10px;padding-bottom:10px}}
          @media (orientation:landscape) and (min-width:600px){body.elevator-fullscreen .elevator-shell{padding:7px;gap:8px}}
          EOF
          sed -i 's/^          //' css/v515-final.css

          cat > sw.js <<'EOF'
          /* v5.15.0 — network-first updates + offline shell with external WebP panorama. */
          const VERSION='seowoo-v5.15.0'; const V='5.15.0';
          const CORE=['/','/index.html','/manifest.webmanifest','/icons/icon-192.png','/icons/icon-512.png','/css/app.css','/css/v4.css','/css/v5.css','/css/v5-view.css','/css/v515-final.css','/css/pwa-v514.css','/data/content.js','/js/core.js','/js/games.js','/js/v5-panorama.js','/js/v5.js','/js/app-v4.js','/js/pwa-v514.js','/assets/elevator-city-panorama-v515.webp'].map(path=>`${path}${path.includes('?')?'&':'?'}v=${V}`);
          self.addEventListener('install',event=>{event.waitUntil(caches.open(VERSION).then(cache=>cache.addAll(CORE)).then(()=>self.skipWaiting()));});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key.startsWith('seowoo-')&&key!==VERSION).map(key=>caches.delete(key)))).then(()=>self.clients.claim()));});
          self.addEventListener('fetch',event=>{const request=event.request;if(request.method!=='GET')return;const url=new URL(request.url);if(url.origin!==self.location.origin)return;if(request.mode==='navigate'){event.respondWith(fetch(request,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('navigation failed');const copy=response.clone();event.waitUntil(caches.open(VERSION).then(cache=>cache.put('/index.html?v='+V,copy)));return response;}).catch(async()=>{const cache=await caches.open(VERSION);return(await cache.match('/index.html?v='+V))||(await cache.match('/?v='+V));}));return;}event.respondWith((async()=>{const cache=await caches.open(VERSION);try{const fresh=await fetch(request,{cache:'no-store'});if(fresh.ok)event.waitUntil(cache.put(request,fresh.clone()));return fresh;}catch(e){return(await cache.match(request))||Response.error();}})());});
          self.addEventListener('message',event=>{if(event.data==='SKIP_WAITING'||event.data?.type==='SKIP_WAITING')self.skipWaiting();});
          EOF
          sed -i 's/^          //' sw.js
      - name: Remove interrupted build artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f js/pano-v515-*.js js/placeholder-delete-me __oops_should_not_create.txt
          rm -rf assets/.v515-build
          rm -f assets/.asset-note-v515.txt assets/DO_NOT_KEEP assets/THIS_WILL_BE_REMOVED.txt assets/_debug assets/last-temp assets/stop assets/temp-final
          rm -f .github/workflows/v515-finalize.yml .github/workflows/v515-finalize-run.yml .github/workflows/v515-asset-build.yml
      - name: QA final tree
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v5-panorama.js
          node --check js/v5.js
          node --check js/app-v4.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert '<meta name="app-version" content="5.15.0">' in s
          assert '/css/v515-final.css?v=5.15.0' in s
          assert '/js/v5-panorama.js?v=5.15.0' in s
          assert s.count('<button') == s.count('</button>'), (s.count('<button'),s.count('</button>'))
          PY
          grep -q '/assets/elevator-city-panorama-v515.webp?v=5.15.0' js/v5-panorama.js
          grep -q '/assets/elevator-city-panorama-v515.webp' sw.js
          test -s assets/elevator-city-panorama-v515.webp
          test -f css/v515-final.css
          ! find js -maxdepth 1 -name 'pano-v515-*.js' -print -quit | grep -q .
          ! grep -R -nE 'data:image|__SEOWOO_PANO' index.html js css sw.js manifest.webmanifest
          ! find assets -maxdepth 2 -type f -name '*.b64' -print -quit | grep -q .
      - name: Publish one clean final commit to main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='8b79983346d1f749e34e337e8d73ddda08992e05'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'Complete v5.15.0 external WebP panorama and visual polish' | git commit-tree "$TREE" -p "$EXPECTED_MAIN")"
          git push origin "$COMMIT:refs/heads/main"
          echo "$COMMIT" > /tmp/final_commit
      - name: Verify remote and clean temporary branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(cat /tmp/final_commit)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$COMMIT"
          git push origin --delete v515-build-20260909 || true
          echo "FINAL_COMMIT=$COMMIT" >> "$GITHUB_ENV"
      - name: Final commit
        if: success()
        run: echo "Final main commit is $FINAL_COMMIT"
