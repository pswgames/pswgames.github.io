<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#79c9ff">
  <meta name="description" content="서우가 색깔, 모양, 기억 놀이를 재미있게 즐기는 어린이용 웹앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="서우 놀이터">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <title>서우 놀이터</title>
  <style>
    :root{--bg:#f6fbff;--card:#fff;--text:#20314a;--muted:#667b91;--blue:#5db5f5;--blue2:#e5f5ff;--green:#7bd49d;--yellow:#ffdc72;--pink:#ffc3d8;--line:#dceaf4;--shadow:0 10px 28px rgba(38,91,130,.12);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}button{font:inherit;color:inherit;touch-action:manipulation}.app{width:min(100%,820px);margin:auto;min-height:100vh;background:linear-gradient(180deg,#edf9ff,#fff 60%)}
    .top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:calc(10px + var(--safeT)) 14px 10px;background:rgba(246,251,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#8ed6ff,#fff0a7);font-size:27px;box-shadow:var(--shadow)}.brand b{font-size:22px;letter-spacing:-.04em}.topBtns{display:flex;gap:7px}.icon{width:46px;height:46px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:21px;box-shadow:0 3px 10px rgba(38,91,130,.06)}.icon[hidden]{display:none}
    main{padding:18px 14px calc(28px + var(--safeB))}.screen{display:none}.screen.on{display:block}.hero{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;margin:4px 0 20px}.mascot{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:#fff4bd;font-size:43px;box-shadow:var(--shadow);transform:rotate(-3deg)}h1{margin:0 0 6px;font-size:clamp(27px,7vw,38px);line-height:1.15;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{min-height:166px;border:0;border-radius:27px;padding:17px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);position:relative;overflow:hidden}.game:active{transform:scale(.98)}.game .e{font-size:45px}.game b{display:block;font-size:20px;letter-spacing:-.03em}.game small{display:block;margin-top:4px;color:#526b80;line-height:1.35}.c1{background:#dff4ff}.c2{background:#fff3c9}.c3{background:#eee5ff}.c4{background:#e3f8ea}.note{margin-top:14px;padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);font-weight:800;color:#526b80}
    .bar{display:grid;grid-template-columns:auto minmax(80px,1fr) auto;gap:10px;align-items:center;margin-bottom:16px}.back{min-height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 13px;font-weight:900}.prog{height:13px;background:#e6eef6;border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.25s}.stars{font-weight:950}.prompt{padding:22px 18px;border-radius:27px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}.prompt .tag{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--blue2);font-size:13px;font-weight:900}.prompt h2{margin:12px 0 5px;font-size:clamp(26px,7vw,39px);letter-spacing:-.04em}.prompt p{margin:0;color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.choice{min-height:138px;border:3px solid transparent;border-radius:26px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:62px}.choice.good{border-color:#68c98b;background:#effcf3}.choice.hint{animation:pulse .7s 2}.choice:active{transform:scale(.98)}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,206,78,.22),var(--shadow)}}.swatch{width:78px;height:78px;border-radius:50%;box-shadow:inset -8px -9px rgba(0,0,0,.05)}.feedback{min-height:54px;margin-top:12px;padding:14px;border-radius:17px;background:#eef7fc;text-align:center;font-weight:900;color:#45647a}.feedback.ok{background:#eaf9ef;color:#277141}.memoryStage{min-height:145px;margin-top:14px;border-radius:26px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);font-size:70px}.result{text-align:center;padding:28px 20px;border-radius:28px;background:#fff;box-shadow:var(--shadow)}.result .big{font-size:75px}.result h2{font-size:30px;margin:7px 0}.result p{color:var(--muted)}.btns{display:grid;gap:9px;margin-top:17px}.primary,.secondary{min-height:54px;border:0;border-radius:17px;font-weight:950;font-size:17px}.primary{background:#3c96d5;color:#fff}.secondary{background:#edf4f9}.parentCard{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.stat{background:#f2f8fc;border-radius:18px;padding:15px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}
    dialog{border:0;padding:0;background:transparent;color:var(--text)}dialog::backdrop{background:rgba(20,43,60,.48);backdrop-filter:blur(4px)}.install{width:min(92vw,430px)}.installCard{padding:23px;border-radius:29px;background:#fff;box-shadow:0 28px 90px rgba(20,43,60,.28);text-align:center}.installAppIcon{width:84px;height:84px;margin:auto;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#e7f7ff,#fff1a5);font-size:48px}.installCard h2{margin:12px 0 6px;font-size:25px;letter-spacing:-.04em}.installCard>p{margin:0;color:var(--muted);line-height:1.5}.steps{display:grid;gap:8px;margin-top:17px;text-align:left}.step{display:grid;grid-template-columns:37px minmax(0,1fr);gap:10px;align-items:center;padding:10px 11px;border-radius:16px;background:#f4f9fd;border:1px solid #e8f0f6}.step em{width:35px;height:35px;border-radius:11px;background:#fff;display:grid;place-items:center;font-style:normal;font-weight:950}.step b{display:block;font-size:14px}.step small{display:block;margin-top:2px;color:var(--muted);line-height:1.35}.foot{margin-top:10px!important;font-size:12px!important}.installFallback{display:block;position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);z-index:1000}.installFallback:before{content:"";position:fixed;inset:-100vh -100vw;background:rgba(20,43,60,.48);z-index:-1}
    @media(max-width:430px){.top{padding-left:10px;padding-right:10px}.brand b{font-size:19px}.logo{width:44px;height:44px}.icon{width:42px;height:42px}.grid{gap:10px}.game{min-height:151px;padding:14px}.game .e{font-size:40px}.game b{font-size:18px}.choices{gap:10px}.choice{min-height:125px}.swatch{width:68px;height:68px}.installCard{padding:20px 17px}.installAppIcon{width:76px;height:76px;font-size:43px}}@media(max-width:340px){.grid,.choices{grid-template-columns:1fr}.game{min-height:125px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><div class="logo">🌟</div><b>서우 놀이터</b></div><div class="topBtns"><button id="installTop" class="icon" aria-label="홈 화면에 추가">⬇️</button><button id="parentTop" class="icon" aria-label="보호자 기록">👨‍👩‍👦</button></div></header>
  <main>
    <section id="home" class="screen on"><div class="hero"><div class="mascot">⭐</div><div><h1>서우야, 오늘 뭐 하고 놀까?</h1><p>짧게 놀고, 많이 칭찬받는 놀이야.</p></div></div><div class="grid"><button class="game c1" data-game="color"><span class="e">🎈</span><span><b>색깔 찾아줘!</b><small>알록달록 색을 찾아봐</small></span></button><button class="game c2" data-game="shape"><span class="e">🔺</span><span><b>같은 모양 찾기</b><small>동그라미·세모·네모</small></span></button><button class="game c3" data-game="memory"><span class="e">🧠</span><span><b>기억하고 톡톡!</b><small>보고 기억한 순서대로</small></span></button><button class="game c4" id="parentCard"><span class="e">🏆</span><span><b>오늘의 기록</b><small>보호자와 같이 봐요</small></span></button></div><div class="note">💛 틀려도 괜찮아. 다시 찾으면 돼!</div></section>
    <section id="game" class="screen"><div class="bar"><button class="back" id="back">← 홈</button><div class="prog"><i id="prog"></i></div><div class="stars" id="star">⭐ 0</div></div><div id="gameArea"></div></section>
    <section id="result" class="screen"><div class="result"><div class="big">🎉</div><h2>멋지게 놀았어!</h2><p id="resultText"></p><div class="btns"><button class="primary" id="again">한 번 더!</button><button class="secondary" id="other">다른 놀이</button></div></div></section>
    <section id="parent" class="screen"><div class="bar"><button class="back" id="parentBack">← 홈</button></div><div class="parentCard"><h2 style="margin-top:0">보호자 놀이 기록</h2><p style="color:var(--muted);line-height:1.5">발달검사가 아닌, 이 기기에서의 놀이 기록입니다.</p><div class="stats"><div class="stat"><b id="rounds">0판</b><span>완료한 놀이</span></div><div class="stat"><b id="first">0⭐</b><span>첫 시도 성공</span></div><div class="stat"><b id="rate">-</b><span>전체 정답 비율</span></div><div class="stat"><b id="total">0회</b><span>총 선택 횟수</span></div></div></div></section>
  </main>
</div>
<dialog id="installDialog" class="install"><div class="installCard"><div class="installAppIcon">🌟</div><h2>홈 화면에 추가할까요?</h2><p>추가하면 다음부터 주소 입력 없이 앱처럼 바로 열 수 있어요.</p><div class="steps" id="installSteps"></div><div class="btns"><button class="primary" id="installAction">홈 화면에 설치</button><button class="secondary" id="installClose">지금은 놀기</button></div><p class="foot" id="installFoot"></p></div></dialog>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const screens={home:$('#home'),game:$('#game'),result:$('#result'),parent:$('#parent')};const STORE='seowoo-play-v2';const defaults={total:0,correct:0,rounds:0,first:0,byGame:{color:0,shape:0,memory:0}};let stats=load(),type='',q=0,score=0,tries=0,locked=false,seq=[],pos=0,deferred=null;const N=6;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return {...defaults}}}function save(){localStorage.setItem(STORE,JSON.stringify(stats))}function show(n){Object.values(screens).forEach(x=>x.classList.remove('on'));screens[n].classList.add('on');scrollTo({top:0,behavior:'smooth'})}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;u.pitch=1.06;speechSynthesis.speak(u)}function prog(){ $('#prog').style.width=`${q/N*100}%`;$('#star').textContent=`⭐ ${score}` }
const colors=[['빨간색','#ef5b5b'],['노란색','#f5c84c'],['파란색','#559be7'],['초록색','#62bd79'],['보라색','#9a7bd6'],['주황색','#f39a4e']];const shapes=[['동그라미','●'],['세모','▲'],['네모','■'],['별','★'],['하트','♥']];const mem=['🍎','🚗','🐶','⭐'];
function start(t){type=t;q=0;score=0;show('game');next()}function next(){locked=false;tries=0;prog();if(q>=N)return finish();if(type==='color')color();else if(type==='shape')shape();else memory()}
function color(){let target=colors[Math.floor(Math.random()*colors.length)],opts=shuffle([target,...shuffle(colors.filter(x=>x!==target)).slice(0,3)]);$('#gameArea').innerHTML=`<div class="prompt"><span class="tag">🎈 색깔 놀이</span><h2>${target[0]}을 찾아볼까?</h2><p>같은 색을 톡 눌러줘</p></div><div class="choices">${opts.map(o=>`<button class="choice" data-n="${o[0]}"><span class="swatch" style="background:${o[1]}"></span></button>`).join('')}</div><div class="feedback" id="feed">천천히 보고 골라도 괜찮아 😊</div>`;say(`${target[0]}을 찾아볼까?`);$$('.choice').forEach(b=>b.onclick=()=>answer(b,b.dataset.n===target[0],target[0]))}
function shape(){let target=shapes[Math.floor(Math.random()*shapes.length)],opts=shuffle([target,...shuffle(shapes.filter(x=>x!==target)).slice(0,3)]);$('#gameArea').innerHTML=`<div class="prompt"><span class="tag">🔺 모양 놀이</span><h2>${target[0]}을 찾아볼까?</h2><p>같은 모양을 톡 눌러줘</p></div><div class="choices">${opts.map(o=>`<button class="choice" data-n="${o[0]}">${o[1]}</button>`).join('')}</div><div class="feedback" id="feed">모양을 잘 살펴봐 😊</div>`;say(`${target[0]}을 찾아볼까?`);$$('.choice').forEach(b=>b.onclick=()=>answer(b,b.dataset.n===target[0],target[0]))}
function answer(b,ok,target){if(locked)return;tries++;stats.total++;if(ok){locked=true;stats.correct++;if(tries===1)stats.first++;score++;save();b.classList.add('good');$('#feed').className='feedback ok';$('#feed').textContent='딩동댕! 잘 찾았어! ⭐';say('딩동댕! 잘 찾았어!');q++;prog();setTimeout(next,700)}else{save();$('#feed').textContent='괜찮아, 다시 찾아보자 😊';say('괜찮아. 다시 찾아보자.');if(tries>=2)$$('.choice').forEach(x=>{if(x.dataset.n===target)x.classList.add('hint')})}}
function memory(){let len=q<2?1:q<5?2:3;seq=Array.from({length:len},()=>mem[Math.floor(Math.random()*mem.length)]);pos=0;locked=true;$('#gameArea').innerHTML=`<div class="prompt"><span class="tag">🧠 기억 놀이</span><h2>잘 보고 기억해봐!</h2><p>같은 순서로 눌러줘</p></div><div class="memoryStage" id="stage"></div><div class="choices">${mem.map(x=>`<button class="choice" data-i="${x}" disabled>${x}</button>`).join('')}</div><div class="feedback" id="feed">눈으로 쏙 기억해보자 👀</div>`;say('잘 보고 기억해봐!');let i=0,stage=$('#stage');const one=()=>{if(i<seq.length){stage.textContent=seq[i++];setTimeout(()=>{stage.textContent='';setTimeout(one,220)},650)}else setTimeout(()=>{stage.textContent='❓';locked=false;$$('.choice').forEach(b=>{b.disabled=false;b.onclick=memAnswer});say('이제 순서대로 눌러볼까?')},260)};one()}
function memAnswer(e){if(locked)return;stats.total++;let item=e.currentTarget.dataset.i;if(item===seq[pos]){pos++;if(pos===seq.length){locked=true;stats.correct++;stats.first++;score++;save();$('#feed').className='feedback ok';$('#feed').textContent='우와! 순서를 기억했네! ⭐';say('우와! 순서를 기억했네!');q++;prog();setTimeout(next,750)}else{$('#feed').textContent='맞아! 다음 것도 기억해볼까?';say('맞아! 다음 것도 기억해볼까?')}}else{pos=0;save();$('#feed').textContent='괜찮아! 처음부터 다시 눌러보자 😊';say('괜찮아. 처음부터 다시 해보자.')}}
function finish(){stats.rounds++;stats.byGame=stats.byGame||{};stats.byGame[type]=(stats.byGame[type]||0)+1;save();$('#resultText').textContent=`별을 ${score}개 모았어! 잘했어, 서우야 ⭐`;show('result');say(`멋지게 놀았어! 별을 ${score}개 모았어!`)}function parent(){let r=stats.total?Math.round(stats.correct/stats.total*100):0;$('#rounds').textContent=`${stats.rounds||0}판`;$('#first').textContent=`${stats.first||0}⭐`;$('#rate').textContent=stats.total?`${r}%`:'-';$('#total').textContent=`${stats.total||0}회`;show('parent')}
$$('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#back').onclick=()=>show('home');$('#other').onclick=()=>show('home');$('#again').onclick=()=>start(type);$('#parentBack').onclick=()=>show('home');$('#parentTop').onclick=parent;$('#parentCard').onclick=parent;
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}function safari(){return /safari/i.test(navigator.userAgent)&&!/crios|fxios|edgios|opr\//i.test(navigator.userAgent)}function renderInstall(){if(deferred){$('#installSteps').innerHTML='<div class="step"><em>1</em><div><b>아래 설치 버튼을 눌러요</b><small>브라우저의 앱 설치 창이 열려요.</small></div></div><div class="step"><em>2</em><div><b>설치를 확인해요</b><small>홈 화면에 서우 놀이터가 생겨요.</small></div></div>';$('#installAction').textContent='홈 화면에 설치';$('#installFoot').textContent='설치 후에는 주소창 없이 앱처럼 바로 열립니다.'}else if(ios()){$('#installSteps').innerHTML='<div class="step"><em>1</em><div><b>Safari 공유 버튼(□↑)</b><small>화면 아래쪽 또는 주소창 주변의 공유 버튼을 눌러요.</small></div></div><div class="step"><em>2</em><div><b>홈 화면에 추가</b><small>메뉴를 내려서 ‘홈 화면에 추가’를 선택해요.</small></div></div><div class="step"><em>3</em><div><b>오른쪽 위 ‘추가’</b><small>이제 홈 화면에서 바로 실행할 수 있어요.</small></div></div>';$('#installAction').textContent=safari()?'설치 방법 확인했어요':'Safari에서 열어 추가하기';$('#installFoot').textContent='아이폰/iPad는 브라우저 보안 정책 때문에 웹페이지가 홈 화면 추가 창을 자동으로 열 수 없습니다.'}else{$('#installSteps').innerHTML='<div class="step"><em>1</em><div><b>브라우저 메뉴(⋮)를 열어요</b><small>Chrome·Edge 메뉴를 눌러요.</small></div></div><div class="step"><em>2</em><div><b>앱 설치 / 홈 화면에 추가</b><small>표시되는 항목을 선택하면 돼요.</small></div></div>';$('#installAction').textContent='설치 메뉴 안내';$('#installFoot').textContent='설치 가능한 브라우저에서는 설치 버튼이 자동으로 연결됩니다.'}}
function openInstall(){if(standalone())return;renderInstall();let d=$('#installDialog');if(d.showModal){if(!d.open)d.showModal()}else{d.setAttribute('open','');d.classList.add('installFallback')}}function closeInstall(){let d=$('#installDialog');if(d.close&&d.open)d.close();d.removeAttribute('open');d.classList.remove('installFallback')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;renderInstall()});window.addEventListener('appinstalled',()=>{deferred=null;closeInstall();$('#installTop').hidden=true});$('#installTop').onclick=openInstall;$('#installClose').onclick=closeInstall;$('#installAction').onclick=async()=>{if(deferred){deferred.prompt();let c=await deferred.userChoice;if(c.outcome==='accepted'){deferred=null;closeInstall()}}else renderInstall()};if(standalone())$('#installTop').hidden=true;else setTimeout(openInstall,450);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
